<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vulkan Ray Tracer</title>
<!--
  An icon, or every load asks the server root for /favicon.ico, gets a 404, and that 404 comes back into
  the run log as a failure sitting next to the measurements. 1150 bytes, generated by
  browser/tools/make_favicon.py: nothing downloaded, so the asset has provenance.
-->
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<!--
  The interface is the render window and nothing else, like the desktop exe: no report page, no
  results panel, no buttons. The title element is only a starting value - app.js replaces it with
  the exe's title-bar string once a second (src/frame.cpp:1447-1464), and with the quit string when
  ESC is pressed. Everything the exe writes to raytracer.log goes to the console.
  The one element that is not the canvas is #status below: the exe's window-decoration text, which a
  page has no window decoration to hold. It is a deviation from the contract, asked for explicitly, and
  README.md section 4.1 says so.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  /* No scrollbar, no letterbox gap: the canvas is the viewport. */
  #view { display: block; width: 100vw; height: 100vh; background: #000; }
  /*
    The canvas blit samples the presentation texture with NEAREST, so when the trace target is
    smaller than the canvas the pixels are magnified honestly rather than interpolated into
    sharpness that was never rendered. `image-rendering: pixelated` keeps the browser's own
    compositing step doing the same thing at a fractional devicePixelRatio.
  */
  #view { image-rendering: pixelated; }
  /*
    The status overlay: a deliberate deviation from "the canvas is the only interface", asked for
    explicitly, and recorded as a deviation in browser/README.md section 4.1. It is the exe's
    window-decoration text, which a page has no equivalent of. Four properties are the point of it:
    `position: fixed` takes it out of the layout, so nothing it says can move or resize the canvas;
    `pointer-events: none` lets a click fall through to the canvas, which is what keeps the pointer-lock
    gesture working (free look asks for the lock on a canvas click); it is not focusable, so it cannot
    take focus away from the window; and the translucent plate plus the text shadow is what keeps the
    same line legible over bright sky and over the dark floor, without a solid box sitting on the
    picture.
  */
  #status {
    position: fixed; left: 8px; top: 8px; z-index: 2;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, "Cascadia Mono", Menlo, monospace;
    color: #f2f2f2; white-space: pre; pointer-events: none; user-select: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.92), 0 0 7px rgba(0, 0, 0, 0.6),
                 0 0 1px rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.26); border-radius: 3px; padding: 3px 7px;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<!-- Written by app.js once a second, from the same values document.title carries. -->
<div id="status" aria-live="off"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
